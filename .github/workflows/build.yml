name: Build Syscall Shroud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up DDK environment
      run: |
        # Install the official ddk script
        sudo curl -fsSL https://raw.githubusercontent.com/Ylarod/ddk/main/scripts/ddk -o /usr/local/bin/ddk
        sudo chmod +x /usr/local/bin/ddk

    - name: Build kernel module
      run: |
        # Build the module targeting android16-6.12
        # The ddk script automatically handles pulling the correct Docker image and kernel source
        ddk build android16-6.12

    - name: Prepare module package
      run: |
        mkdir -p module_package
        cp module.prop module_package/
        cp service.sh module_package/
        cp uninstall.sh module_package/
        # Copy the built .ko file
        cp syscall_shroud.ko module_package/
        cd module_package
        zip -r ../SyscallShroud.zip *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SyscallShroud-Module
        path: SyscallShroud.zip
