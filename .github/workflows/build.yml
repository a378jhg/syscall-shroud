name: Build Syscall Shroud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android16-6.12
      options: --privileged
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify source files
      run: |
        if [ ! -f Makefile ]; then echo "Error: Makefile missing"; exit 1; fi
        if [ ! -f syscall_shroud.c ]; then echo "Error: source file missing"; exit 1; fi

    - name: Build kernel module
      run: |
        # KERNEL_SRC is pre-configured in the DDK container
        # KDIR points the external module build to the correct kernel headers
        make KDIR=$KERNEL_SRC 2>&1 | tee build.log
        
        if [ ! -f "syscall_shroud.ko" ]; then
          echo "ERROR: .ko not generated"
          tail -n 50 build.log
          exit 1
        fi

    - name: Prepare module package
      run: |
        mkdir -p module_package/ko
        cp module.prop module_package/
        cp service.sh module_package/
        cp uninstall.sh module_package/
        cp syscall_shroud.ko module_package/ko/
        cd module_package
        zip -r ../SyscallShroud.zip *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SyscallShroud-Module
        path: SyscallShroud.zip
