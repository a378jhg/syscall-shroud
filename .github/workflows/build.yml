name: Build Syscall Shroud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up DDK environment
      run: |
        sudo curl -fsSL https://raw.githubusercontent.com/Ylarod/ddk/main/scripts/ddk -o /usr/local/bin/ddk
        sudo chmod +x /usr/local/bin/ddk

    - name: Build kernel module
      run: |
        ddk build android16-6.12

    - name: Prepare module package
      run: |
        mkdir -p module_package/ko
        cp module.prop module_package/
        cp service.sh module_package/
        cp uninstall.sh module_package/
        
        echo "=== Finding compiled .ko file ==="
        find . -name "*.ko" -type f
        
        echo "=== Copying .ko to package ==="
        find . -name "syscall_shroud.ko" -exec cp {} module_package/ko/ \;
        
        cd module_package
        zip -r ../SyscallShroud.zip *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SyscallShroud-Module
        path: SyscallShroud.zip
